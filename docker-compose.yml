services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sowrabh0/hermes-auth-frontend:v1
    environment:
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL:-https://hermes-auth-backend.azurewebsites.net}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
